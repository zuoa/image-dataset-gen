x-backend-env: &backend-env
  SECRET_KEY: ${SECRET_KEY:-change-me-please-with-at-least-32-bytes}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-too-with-at-least-32-bytes}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-ZGF0YXNldC1nZW4tZGVtby1rZXktMzItYnl0ZXMhISE=}
  DEMO_USERNAME: ${DEMO_USERNAME:-dataset}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-Dataset123!}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4173}
  DATABASE_URL: ${DATABASE_URL:-sqlite:////app/storage/dataset_gen.db}
  AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-true}
  STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}
  VL_ANNOTATOR_PROVIDER: ${VL_ANNOTATOR_PROVIDER:-gemini}
  VL_ANNOTATOR_MODEL: ${VL_ANNOTATOR_MODEL:-gemini-2.0-flash}
  VL_ANNOTATOR_API_KEY: ${VL_ANNOTATOR_API_KEY:-}
  VL_ANNOTATOR_BASE_URL: ${VL_ANNOTATOR_BASE_URL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image-preview}
  GEMINI_PERSON_GENERATION: ${GEMINI_PERSON_GENERATION:-allow_adult}
  GEMINI_HTTP_PROXY: ${GEMINI_HTTP_PROXY:-}
  JIMENG_BASE_URL: ${JIMENG_BASE_URL:-https://operator.las.cn-beijing.volces.com/api/v1}
  JIMENG_IMAGE_MODEL: ${JIMENG_IMAGE_MODEL:-doubao-seedream-3-0-t2i-250415}
  JIMENG_WATERMARK: ${JIMENG_WATERMARK:-true}
  OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
  OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-https://api.deepseek.com/v1}
  OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-deepseek-chat}
  ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
  IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:4173/images}
  TRAINING_WORKER_TOKEN: ${TRAINING_WORKER_TOKEN:-change-me-training-worker-token}
  TRAINING_DEFAULT_MODEL: ${TRAINING_DEFAULT_MODEL:-yolov8n.pt}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/zuoa/dataset-gen-backend:latest}
    build:
      context: ./backend
    init: true
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health")'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - backend_storage:/app/storage
      - generated_images:/app/storage/images

  celery-worker:
    image: ${BACKEND_IMAGE:-ghcr.io/zuoa/dataset-gen-backend:latest}
    build:
      context: ./backend
    init: true
    restart: unless-stopped
    environment:
      <<: *backend-env
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage
      - generated_images:/app/storage/images
    command:
      - celery
      - -A
      - app.celery_worker
      - worker
      - --concurrency=1
      - --pool=solo
      - --loglevel=info

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/zuoa/dataset-gen-frontend:latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    volumes:
      - generated_images:/usr/share/nginx/html/images:ro

  trainer:
    profiles: ["training"]
    build:
      context: ./trainer
    init: true
    restart: unless-stopped
    environment:
      TRAINER_BACKEND_URL: ${TRAINER_BACKEND_URL:-http://backend:8000/api/v1}
      TRAINER_WORKER_TOKEN: ${TRAINING_WORKER_TOKEN:-change-me-training-worker-token}
      TRAINER_WORKER_ID: ${TRAINER_WORKER_ID:-local-trainer}
      TRAINER_WORKER_NAME: ${TRAINER_WORKER_NAME:-Local YOLO Trainer}
      TRAINER_POLL_INTERVAL_SECONDS: ${TRAINER_POLL_INTERVAL_SECONDS:-5}
      TRAINER_WORK_ROOT: /app/work
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8010/health")'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - trainer_work:/app/work

volumes:
  backend_storage:
  generated_images:
  trainer_work:
