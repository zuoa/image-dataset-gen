x-backend-env: &backend-env
  APP_ENV: production
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4173}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dataset_gen}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dataset_gen}
  AUTO_CREATE_SCHEMA: "false"
  BOOTSTRAP_DEMO_USER: "false"
  REGISTRATION_MODE: ${REGISTRATION_MODE:-disabled}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
  REFRESH_ROTATION_GRACE_SECONDS: ${REFRESH_ROTATION_GRACE_SECONDS:-10}
  STORAGE_ROOT: /app/storage
  STORAGE_BACKEND: local
  USE_X_ACCEL_REDIRECT: "true"
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
  MAX_IMPORTED_IMAGES: ${MAX_IMPORTED_IMAGES:-2000}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  TRAINING_WORKER_TOKEN: ${TRAINING_WORKER_TOKEN:?set TRAINING_WORKER_TOKEN in .env}
  TRAINING_DEFAULT_MODEL: ${TRAINING_DEFAULT_MODEL:-yolov8n.pt}
  TRAINING_JOB_LEASE_SECONDS: ${TRAINING_JOB_LEASE_SECONDS:-120}
  TASK_ITEM_LEASE_SECONDS: ${TASK_ITEM_LEASE_SECONDS:-900}
  ASSET_GC_RETENTION_HOURS: ${ASSET_GC_RETENTION_HOURS:-24}
  IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-60000}
  VL_ANNOTATOR_PROVIDER: ${VL_ANNOTATOR_PROVIDER:-gemini}
  VL_ANNOTATOR_MODEL: ${VL_ANNOTATOR_MODEL:-gemini-2.0-flash}
  VL_ANNOTATOR_API_KEY: ${VL_ANNOTATOR_API_KEY:-}
  VL_ANNOTATOR_BASE_URL: ${VL_ANNOTATOR_BASE_URL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image-preview}
  GEMINI_PERSON_GENERATION: ${GEMINI_PERSON_GENERATION:-allow_adult}
  GEMINI_HTTP_PROXY: ${GEMINI_HTTP_PROXY:-}
  JIMENG_BASE_URL: ${JIMENG_BASE_URL:-https://operator.las.cn-beijing.volces.com/api/v1}
  JIMENG_IMAGE_MODEL: ${JIMENG_IMAGE_MODEL:-doubao-seedream-3-0-t2i-250415}
  JIMENG_WATERMARK: ${JIMENG_WATERMARK:-true}
  OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
  OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-https://api.deepseek.com/v1}
  OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-deepseek-chat}

x-backend-service: &backend-service
  image: ${BACKEND_IMAGE:-ghcr.io/zuoa/dataset-gen-backend:latest}
  build:
    context: ./backend
  init: true
  restart: unless-stopped
  environment: *backend-env
  volumes:
    - backend_storage:/app/storage
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dataset_gen}
      POSTGRES_USER: ${POSTGRES_USER:-dataset_gen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  migrate:
    <<: *backend-service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  backend:
    <<: *backend-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  outbox-dispatcher:
    <<: *backend-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["python", "run_outbox.py"]

  generation-worker:
    <<: *backend-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_worker", "worker", "-Q", "generation", "--concurrency=2", "--loglevel=info"]

  media-worker:
    <<: *backend-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_worker", "worker", "-Q", "media", "--concurrency=1", "--loglevel=info"]

  maintenance:
    <<: *backend-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "run_maintenance.py"]

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/zuoa/dataset-gen-frontend:latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    volumes:
      - backend_storage:/srv/dataset-storage:ro
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  backend_storage:
