name: ci

permissions:
  contents: read
  packages: write

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dataset_gen_test
          POSTGRES_USER: dataset_gen
          POSTGRES_PASSWORD: dataset_gen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataset_gen -d dataset_gen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            annotator/requirements.txt
            trainer/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Verify PostgreSQL migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://dataset_gen:dataset_gen_test@127.0.0.1:5432/dataset_gen_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          python tests/_legacy_schema_fixture.py
          alembic upgrade head
          alembic check
      - name: Backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q
      - name: Annotator tests
        working-directory: annotator
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest -q
      - name: Trainer tests
        working-directory: trainer
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/dataset-gen-backend
            build_args: ""
          - service: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/dataset-gen-frontend
            build_args: |
              VITE_API_BASE_URL=/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'master' || github.ref_name == 'main' }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
