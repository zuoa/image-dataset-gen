name: segmenter-image

permissions:
  contents: read
  packages: write

on:
  push:
    branches: ["master", "main"]
    paths:
      - "segmenter/**"
      - ".github/workflows/segmenter-image.yml"
  pull_request:
    paths:
      - "segmenter/**"
      - ".github/workflows/segmenter-image.yml"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/dataset-gen-segmenter
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'master' || github.ref_name == 'main' }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./segmenter
          file: ./segmenter/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=segmenter
          cache-to: type=gha,mode=max,scope=segmenter
